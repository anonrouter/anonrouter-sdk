name: Bug report
description: Something in one of the SDK packages does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, prompts, response
        content, private keys, or raw attestation bodies into this issue. A
        `code` string and a sanitized error message are enough.

        Found a security vulnerability? Do not open an issue. Email
        contact@anonrouter.ai instead. See `SECURITY.md`.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@anonrouter/confidential (npm)"
        - "@anonrouter/client (npm)"
        - anonrouter-confidential (PyPI)
        - Shared pins or vectors
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node version, Python version, or the browser and version.
      placeholder: "Node 22.11.0 / Python 3.12.4 / Firefox 130"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider route
      description: Which route were you calling, if any.
      options:
        - near-ai
        - venice
        - chutes
        - tinfoil
        - Not provider specific
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the error `code` and message. Redact any content.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal snippet is ideal. Replace real keys with a placeholder.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I have removed API keys, prompts, and response content from this report.
          required: true
        - label: This is not a security vulnerability report.
          required: true
