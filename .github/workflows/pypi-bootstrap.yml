name: Publish Python 0.1.3 to PyPI

# One-time publication of the already accepted release. Never rebuild or retag
# 0.1.3, and never rerun the npm publication to bootstrap Python.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  acceptance:
    name: Validate released artifacts and current gateway
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Accepted v0.1.3 commit, independent of mutable main and tag names.
          ref: deb7c0ec23d7f2b081eaaca71414daae69c4c42a
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download and verify the accepted release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/artifacts dist/pypi
          gh release download v0.1.3 --repo anonrouter/anonrouter-sdk --dir dist/artifacts
          cd dist/artifacts
          echo 'b11541a1b201d49e0b005c5d5d35ab23fb180f6d2606d690c638456daa324583  SHA256SUMS' | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
          cp anonrouter_confidential-0.1.3-py3-none-any.whl anonrouter_confidential-0.1.3.tar.gz ../pypi/
      - name: Validate PyPI metadata
        run: |
          python -m pip install build twine
          python -m twine check --strict dist/pypi/*
      - name: Fresh packed installs verify current production without credentials or inference
        run: |
          chmod +x dist/artifacts/anonrouter-dcap-verifier-linux-amd64
          node scripts/check-live-gateways.mjs --out live-sdk-acceptance.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pypi-distributions
          path: dist/pypi/
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: pypi-live-acceptance
          path: live-sdk-acceptance.json
          if-no-files-found: warn

  publish:
    name: Publish accepted Python distributions
    needs: acceptance
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anonrouter-confidential/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pypi-distributions
          path: dist/pypi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi
