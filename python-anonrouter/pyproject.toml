[project]
name = "anonrouter-sdk"
version = "0.1.0"
description = "The AnonRouter Python package: verified routes and encrypted inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["anonrouter", "tee", "e2ee", "attestation", "confidential", "privacy"]
authors = [{ name = "AnonRouter" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
]
dependencies = ["anonrouter-confidential[connection-binding]>=0.1.3.post1,<0.2"]

[project.urls]
Homepage = "https://anonrouter.ai"
Documentation = "https://docs.anonrouter.ai"
Repository = "https://github.com/anonrouter/anonrouter-sdk"
Issues = "https://github.com/anonrouter/anonrouter-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonrouter"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
